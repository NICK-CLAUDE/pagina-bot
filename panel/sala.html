<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060b14">
<title>Bot Room</title>
<style>
:root{--bg:#060b14;--card:#0c1522;--line:#1a2a40;--tx:#d7e3f4;--mut:#7d8fa8;--ok:#2dd4a0;--mal:#ff5d6c;--amb:#f5b942;--azul:#5ab0ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
header b{letter-spacing:.14em;font-size:13px}header b i{color:var(--azul);font-style:normal}
header span{margin-left:auto;font-size:12px;color:var(--mut)}
.pt{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block;margin-right:5px}.pt.v{background:var(--ok)}.pt.m{background:var(--mal)}
#esc{position:relative;height:52vh;min-height:280px;max-height:520px;background:#060c18;transition:height .4s}
#esc.off{height:44px;min-height:44px}#esc.off canvas,#esc.off #aviso{display:none}
#esc canvas{display:block;width:100%;height:100%;touch-action:pan-y}
#aviso{position:absolute;left:12px;top:10px;font-size:11px;color:var(--amb);background:#000a;padding:3px 8px;border-radius:6px}
#btn3d{position:absolute;right:12px;top:10px;font-size:11px;color:var(--tx);background:#000a;border:1px solid var(--line);padding:4px 10px;border-radius:6px}
main{padding:12px 16px;display:grid;gap:12px;max-width:900px;margin:auto}
.fila{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.t{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.t small{display:block;color:var(--mut);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.t b{font-size:22px}.t span{display:block;color:var(--mut);font-size:11.5px}
.verde{color:var(--ok)}.rojo{color:var(--mal)}.amb{color:var(--amb)}
.bot{display:flex;align-items:center;gap:10px}
.bot i{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 10px var(--c);animation:late 1.6s infinite}
.bot.e-verde{--c:var(--ok)}.bot.e-amb{--c:var(--amb)}.bot.e-rojo{--c:var(--mal)}.bot.e-gris{--c:var(--mut)}.bot.e-verde{border-color:#2dd4a055}
.bot.e-verde i{animation-duration:.7s}.bot.e-rojo i,.bot.e-gris i{animation:none}
@keyframes late{50%{opacity:.35;transform:scale(.7)}}
.pt.v{box-shadow:0 0 8px var(--ok);animation:late 1.6s infinite}
.log p{animation:entra .5s both}@keyframes entra{from{opacity:0;transform:translateX(-12px)}}
.t{transition:border-color .3s}.t:hover{border-color:#2a6fd6}
.bot div{flex:1}.bot b{font-size:15px}
h3{margin:4px 0 0;font-size:11px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.log{background:var(--card);border:1px solid var(--line);border-radius:10px}
.log p{margin:0;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px}.log p:last-child{border:0}
.log em{font-style:normal;color:var(--mut);margin-right:8px}
@media(min-width:700px){.fila{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><b>BOT <i>ROOM</i></b><span><i class="pt" id="pt"></i><em id="est" style="font-style:normal">Connecting…</em></span></header>
<div id="esc"><span id="aviso"></span><button id="btn3d">3D: on</button></div>
<main>
  <div class="fila" id="tiles"></div>
  <h3>Bots</h3><div id="bots" style="display:grid;gap:10px"></div>
  <h3>Activity</h3><div class="log" id="log"></div>
</main>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {EffectComposer} from "three/addons/postprocessing/EffectComposer.js";
import {RenderPass} from "three/addons/postprocessing/RenderPass.js";
import {UnrealBloomPass} from "three/addons/postprocessing/UnrealBloomPass.js";
import {OutputPass} from "three/addons/postprocessing/OutputPass.js";
const $=id=>document.getElementById(id);

// ---------- datos: igual que el panel (túnel de la PC + clave); sin conexión o con ?demo se ven datos de ejemplo
const LS={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}}};
const FIJA=location.hostname.endsWith("github.io"),CLAVE=LS.get("panel_clave");
let BASE=FIJA?LS.get("panel_base"):(location.protocol==="file:"?"":"");
const DEMO_FORZADO=/demo/.test(location.search)||location.protocol==="file:";
const NOM={"Tendencia 4H":"Trend 4H","Williams Ruptura":"Williams Breakout","Rango Asiatico":"Asian Range"};
const nom=n=>NOM[n]||n;
function ejemplo(){
  const curva=[],t0=1770000000;let v=5000;for(let i=0;i<30;i++){v+=(Math.sin(i*1.3)*30+22);curva.push([t0+i*86400,Math.round(v*100)/100])}
  return {demo:true,conectado:true,algo_terminal:true,capital:5000,saldo:v,patrimonio:v+18,hoy_usd:42.1,hoy_pct:.84,total_pct:(v-5000)/50,meta_pct:8,lim_diario:5,lim_total:10,
    bots:[{nombre:"Tendencia 4H",abiertas:1,cerrado:96,flotante:18,ops:4},{nombre:"Williams Ruptura",abiertas:0,cerrado:41,flotante:0,ops:3},{nombre:"Rango Asiatico",abiertas:0,cerrado:-12,flotante:0,ops:2}],
    control:{"Tendencia 4H":"activo","Williams Ruptura":"activo","Rango Asiatico":"pausado"},curva,
    posiciones:[{bot:"Tendencia 4H",sim:"XAUUSD",lado:"compra",neto:18}],
    cerradas_hoy:[{t:t0+86400*29,sim:"USTEC",bot:"Williams Ruptura",neto:41.2}],
    avisos_enviados:[{hora:"09:12",texto:"Trend 4H opened XAUUSD (buy)."},{hora:"07:40",texto:"Williams Breakout closed USTEC: won $41.20."},{hora:"00:05",texto:"New day. Daily loss limit reset."}]};
}
async function leer(){
  if(DEMO_FORZADO)return ejemplo();
  try{
    const r=await fetch(BASE+"estado.json",{cache:"no-store",headers:{"X-Clave":CLAVE}});
    if(!r.ok)throw 0;const d=await r.json();if(d.sin_datos)throw 0;return d;
  }catch(e){return ejemplo()}
}

// ---------- escena 3D (brillo neón, partículas, datos que viajan, cámara que se mece sola)
const esc=$("esc");
const R=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
R.setPixelRatio(Math.min(devicePixelRatio,1.5));esc.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x060c18);S.fog=new THREE.Fog(0x060c18,10,24);
const cam=new THREE.PerspectiveCamera(48,1,.1,60);cam.position.set(0,3.3,8.4);
const ctl=new OrbitControls(cam,R.domElement);ctl.target.set(0,1.5,0);ctl.enableDamping=true;ctl.enablePan=false;ctl.minDistance=5;ctl.maxDistance=12;
ctl.maxPolarAngle=1.45;ctl.minAzimuthAngle=-1;ctl.maxAzimuthAngle=1;
let tocado=-99;ctl.addEventListener("start",()=>tocado=1e9);ctl.addEventListener("end",()=>tocado=performance.now()/1000);
S.add(new THREE.HemisphereLight(0x8fb4ff,0x0a1020,.8),new THREE.AmbientLight(0x7a93bd,.7));
const L1=new THREE.PointLight(0x5ab0ff,40,18);L1.position.set(0,5,4);S.add(L1);
const L2=new THREE.PointLight(0xa070ff,20,12);L2.position.set(-4,3,-1);S.add(L2);
const piso=new THREE.Mesh(new THREE.CircleGeometry(10,48),new THREE.MeshStandardMaterial({color:0x0a1322,roughness:.5,metalness:.5}));
piso.rotation.x=-Math.PI/2;S.add(piso);
const rej=new THREE.GridHelper(20,30,0x1f4a78,0x10223a);rej.position.y=.01;S.add(rej);
const ADD=o=>Object.assign({transparent:true,blending:THREE.AdditiveBlending,depthWrite:false},o);
// radar que barre el piso
const radar=new THREE.Group();S.add(radar);
{const m=new THREE.Mesh(new THREE.RingGeometry(1.2,7,48,1,0,.55),new THREE.MeshBasicMaterial(ADD({color:0x3a8cff,opacity:.13,side:THREE.DoubleSide})));m.rotation.x=-Math.PI/2;m.position.y=.02;radar.add(m)}
// partículas que suben
const NP=260,pp=new Float32Array(NP*3);for(let i=0;i<NP;i++){pp[i*3]=(Math.random()-.5)*16;pp[i*3+1]=Math.random()*6;pp[i*3+2]=(Math.random()-.5)*10}
const pg=new THREE.BufferGeometry();pg.setAttribute("position",new THREE.BufferAttribute(pp,3));
S.add(new THREE.Points(pg,new THREE.PointsMaterial(ADD({color:0x6ab8ff,size:.045,opacity:.75}))));

function pantalla(w,h,px=512){
  const c=document.createElement("canvas");c.width=px;c.height=Math.round(px*h/w);
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
  const g=new THREE.Group();
  const halo=new THREE.Mesh(new THREE.PlaneGeometry(w+.35,h+.35),new THREE.MeshBasicMaterial(ADD({color:0x2a6fd6,opacity:.35})));halo.position.z=-.06;g.add(halo);
  g.add(new THREE.Mesh(new THREE.BoxGeometry(w+.12,h+.12,.08),new THREE.MeshStandardMaterial({color:0x14243a,metalness:.7,roughness:.4})));
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex}));m.position.z=.05;g.add(m);
  const scan=new THREE.Mesh(new THREE.PlaneGeometry(w,.05),new THREE.MeshBasicMaterial(ADD({color:0x9fd0ff,opacity:.18})));scan.position.z=.06;g.add(scan);
  return {g,c:c.getContext("2d"),tex,w:c.width,h:c.height,scan,hh:h,halo};
}
const PI=pantalla(2.4,1.7),PC=pantalla(3.6,2.2,640),PD=pantalla(2.4,1.7);
PI.g.position.set(-3.6,2.2,-3.1);PI.g.rotation.y=.5;PC.g.position.set(0,2.6,-3.7);PD.g.position.set(3.6,2.2,-3.1);PD.g.rotation.y=-.5;
S.add(PI.g,PC.g,PD.g);
const PANT=[PI,PC,PD];

const COL={verde:0x2dd4a0,rojo:0xff5d6c,amb:0xf5b942,gris:0x7d8fa8};
function robot(){
  const g=new THREE.Group(),cu=new THREE.Group();g.add(cu);
  const met=new THREE.MeshStandardMaterial({color:0xe3ebf6,metalness:.3,roughness:.4});
  const neg=new THREE.MeshStandardMaterial({color:0x05080f,metalness:.9,roughness:.1});
  const mats=[0,1,2,3,4].map(()=>new THREE.MeshBasicMaterial(ADD({color:COL.amb})));   // ojos, antena, aro, onda, holograma
  const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.26,.32,6,16),met);torso.position.y=.75;cu.add(torso);
  const pecho=new THREE.Mesh(new THREE.CircleGeometry(.07,16),mats[0]);pecho.position.set(0,.85,.27);cu.add(pecho);
  const cab=new THREE.Group();cab.position.y=1.32;cu.add(cab);
  cab.add(new THREE.Mesh(new THREE.SphereGeometry(.3,24,18),met));
  const vis=new THREE.Mesh(new THREE.SphereGeometry(.24,20,14),neg);vis.position.z=.1;vis.scale.set(1,.8,.75);cab.add(vis);
  const ojos=new THREE.Group();ojos.position.set(0,.02,.29);cab.add(ojos);
  for(const x of[-.09,.09]){const o=new THREE.Mesh(new THREE.SphereGeometry(.04,10,8),mats[0]);o.position.x=x;ojos.add(o)}
  const ant=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.18),met);ant.position.y=.36;cab.add(ant);
  const punta=new THREE.Mesh(new THREE.SphereGeometry(.045,10,8),mats[1]);punta.position.y=.47;cab.add(punta);
  const brazos=[-1,1].map(l=>{const p=new THREE.Group();p.position.set(l*.34,.98,0);
    const b=new THREE.Mesh(new THREE.CapsuleGeometry(.065,.26,4,10),met);b.position.y=-.2;p.add(b);
    const m=new THREE.Mesh(new THREE.SphereGeometry(.075,10,8),met);m.position.y=-.4;p.add(m);cu.add(p);return p});
  const aro=new THREE.Mesh(new THREE.TorusGeometry(.5,.025,8,48),mats[2]);aro.rotation.x=Math.PI/2;aro.position.y=.04;g.add(aro);
  const onda=new THREE.Mesh(new THREE.RingGeometry(.47,.53,48),mats[3]);onda.rotation.x=-Math.PI/2;onda.position.y=.03;g.add(onda);
  // holograma arriba de la cabeza: aro que gira + barritas tipo velas (solo cuando está operando)
  const holo=new THREE.Group();holo.position.y=1.98;cu.add(holo);
  const hr=new THREE.Mesh(new THREE.TorusGeometry(.26,.012,6,40),mats[4]);hr.rotation.x=Math.PI/2;holo.add(hr);
  const barras=[0,1,2,3,4].map(i=>{const b=new THREE.Mesh(new THREE.BoxGeometry(.05,.2,.05),mats[4]);b.position.x=(i-2)*.09;holo.add(b);return b});
  const lab=document.createElement("canvas");lab.width=256;lab.height=64;const tx=new THREE.CanvasTexture(lab);tx.colorSpace=THREE.SRGBColorSpace;
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true,depthWrite:false,depthTest:false}));spr.scale.set(1.3,.32,1);spr.position.set(0,.12,.85);spr.renderOrder=9;g.add(spr);
  g.userData={cu,cab,ojos,brazos,aro,onda,holo,barras,mats,lab,tx,f:Math.random()*6,col:"amb"};
  return g;
}
let ROB=[];
const DEST=new THREE.Vector3(0,2.6,-3.6);
function poner(bots){
  if(ROB.length===bots.length)return;
  ROB.forEach(r=>S.remove(r));ROB=bots.map(()=>{const r=robot();S.add(r);return r});
  const n=ROB.length;ROB.forEach((r,i)=>{const a=(i-(n-1)/2)*.75;r.position.set(Math.sin(a)*3.4,0,Math.cos(a)*-1.2+.2);r.rotation.y=-a*.6;
    const o=r.position.clone().setY(1.3);r.userData.curva=new THREE.QuadraticBezierCurve3(o,o.clone().lerp(DEST,.5).setY(4.2),DEST)});
}
// paquetes de datos que viajan de cada robot a la pantalla central
const PAQ=[...Array(30)].map(()=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.05,8,6),new THREE.MeshBasicMaterial(ADD({color:0xffffff})));m.visible=false;S.add(m);return {m,t:0,r:null}});
function lanzar(r){const p=PAQ.find(p=>!p.r);if(!p)return;p.r=r;p.t=0;p.m.visible=true;p.m.material.color.setHex(COL[r.userData.col])}

// brillo (bloom); si el celu no llega a ~35 cuadros por segundo se apaga solo
const C=new EffectComposer(R);C.addPass(new RenderPass(S,cam));
const bloom=new UnrealBloomPass(new THREE.Vector2(1,1),.95,.5,.72);C.addPass(bloom);C.addPass(new OutputPass());
let conBrillo=true,frames=0,acum=0;
function ajustar(){const w=esc.clientWidth,h=esc.clientHeight;R.setSize(w,h);C.setPixelRatio(R.getPixelRatio());C.setSize(w,h);
  cam.aspect=w/h;cam.fov=w/h<1?Math.min(95,48/(w/h)**.7):48;cam.updateProjectionMatrix()}
addEventListener("resize",ajustar);ajustar();

// ---------- estado de cada bot -> color y mensaje
function estadoBot(d,b){
  if(!d.conectado||!d.algo_terminal)return ["gris","Offline"];
  if((d.control||{})[b.nombre]==="pausado")return ["rojo","Paused"];
  if(b.abiertas>0)return ["verde","In a trade"];
  return ["amb","Watching"];
}
const usd=v=>(v<0?"-":"")+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const cl=v=>v>0?"verde":v<0?"rojo":"";

let D=null,tD=0,saldoVisto=null;
// pantalla central: se redibuja ~12 veces por segundo (curva que se dibuja, punto que late, cinta de avisos)
function centro(s){
  if(!D)return;const d=D,c=PC.c,W=PC.w,H=PC.h;
  saldoVisto=saldoVisto==null?d.saldo:saldoVisto+(d.saldo-saldoVisto)*.15;
  c.fillStyle="#07101d";c.fillRect(0,0,W,H);
  c.fillStyle="#7d8fa8";c.font="600 22px system-ui";c.fillText("BALANCE",28,40);
  c.fillStyle="#2dd4a0";c.globalAlpha=.6+.4*Math.abs(Math.sin(s*2));c.beginPath();c.arc(150,33,6,0,7);c.fill();c.globalAlpha=1;
  c.fillStyle="#7d8fa8";c.font="600 18px system-ui";c.fillText("LIVE",162,40);
  c.fillStyle=d.total_pct>=0?"#2dd4a0":"#ff5d6c";c.font="700 64px system-ui";c.fillText(usd(saldoVisto),28,108);
  c.fillStyle="#7d8fa8";c.font="22px system-ui";c.fillText("Goal "+d.meta_pct+"%   ·   so far "+(d.total_pct>0?"+":"")+d.total_pct.toFixed(2)+"%",28,146);
  const p=Math.max(0,Math.min(1,d.total_pct/d.meta_pct)),bw=(W-56)*p;
  c.fillStyle="#13223a";c.fillRect(28,160,W-56,14);c.fillStyle="#2dd4a0";c.fillRect(28,160,bw,14);
  const x0=28+((s*160)%(bw+80))-40,gr=c.createLinearGradient(x0-40,0,x0+40,0);gr.addColorStop(0,"#fff0");gr.addColorStop(.5,"#ffffffaa");gr.addColorStop(1,"#fff0");
  c.fillStyle=gr;c.fillRect(28,160,bw,14);
  const cv=(d.curva||[]).map(x=>x[1]);
  if(cv.length>1){const mn=Math.min(...cv),mx=Math.max(...cv),y0=196,hh=H-y0-50,k=Math.min(1,(s-tD)/1.6),n=Math.max(2,Math.ceil(cv.length*k));
    const P=cv.slice(0,n).map((v,i)=>[28+(W-56)*i/(cv.length-1),y0+hh-(v-mn)/((mx-mn)||1)*hh]);
    const ar=c.createLinearGradient(0,y0,0,y0+hh);ar.addColorStop(0,"#5ab0ff55");ar.addColorStop(1,"#5ab0ff00");
    c.beginPath();P.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.lineTo(P[P.length-1][0],y0+hh);c.lineTo(28,y0+hh);c.fillStyle=ar;c.fill();
    c.beginPath();P.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.strokeStyle="#5ab0ff";c.lineWidth=3;c.stroke();
    const [ex,ey]=P[P.length-1];c.fillStyle="#9fd0ff";c.beginPath();c.arc(ex,ey,5+3*Math.abs(Math.sin(s*3)),0,7);c.fill()}
  // cinta de avisos que corre abajo
  const txt=(d.avisos_enviados||[]).map(a=>a.hora+"  "+a.texto).join("     •     ")||"Waiting for activity";
  c.fillStyle="#0d1a2c";c.fillRect(0,H-36,W,36);c.font="18px system-ui";c.fillStyle="#9fd0ff";
  const tw=c.measureText(txt+"     •     ").width,xx=-((s*70)%tw);c.fillText(txt+"     •     "+txt,xx,H-12);
  PC.tex.needsUpdate=true;
}
function laterales(d){
  let c=PI.c,W=PI.w,H=PI.h;c.fillStyle="#07101d";c.fillRect(0,0,W,H);
  const pd=Math.max(0,-d.hoy_pct),pt=Math.max(0,-d.total_pct);
  c.fillStyle="#7d8fa8";c.font="600 20px system-ui";c.fillText("RISK ROOM LEFT",24,38);
  [["Today",pd,d.lim_diario],["Total",pt,d.lim_total]].forEach(([n,u,m],i)=>{const y=80+i*86,r=1-u/m;
    c.fillStyle="#d7e3f4";c.font="22px system-ui";c.fillText(n+": "+(m-u).toFixed(1)+"% of "+m+"%",24,y);
    c.fillStyle="#13223a";c.fillRect(24,y+12,W-48,12);c.fillStyle=r>.4?"#2dd4a0":r>.2?"#f5b942":"#ff5d6c";c.fillRect(24,y+12,(W-48)*Math.max(0,r),12)});
  PI.tex.needsUpdate=true;
  c=PD.c;W=PD.w;H=PD.h;c.fillStyle="#07101d";c.fillRect(0,0,W,H);
  c.fillStyle="#7d8fa8";c.font="600 20px system-ui";c.fillText("LATEST",24,38);
  const fil=[...(d.posiciones||[]).map(p=>[p.sim+" "+(p.lado==="compra"?"buy":"sell")+" (open)",p.neto??p.flotante??0]),...(d.cerradas_hoy||[]).map(p=>[p.sim+" closed",p.neto])].slice(0,5);
  c.font="22px system-ui";if(!fil.length){c.fillStyle="#7d8fa8";c.fillText("Nothing yet today",24,90)}
  fil.forEach(([t,v],i)=>{c.fillStyle="#d7e3f4";c.fillText(t,24,86+i*44);c.fillStyle=v>=0?"#2dd4a0":"#ff5d6c";c.textAlign="right";c.fillText(usd(v),W-24,86+i*44);c.textAlign="left"});
  PD.tex.needsUpdate=true;
}

// ---------- HUD (HTML)
function pintar(d){
  const pd=Math.max(0,-d.hoy_pct);
  $("tiles").innerHTML=
   `<div class="t"><small>Balance</small><b>${usd(d.saldo)}</b><span>of $${d.capital.toLocaleString("en-US")}</span></div>
    <div class="t"><small>Today</small><b class="${cl(d.hoy_usd)}">${usd(d.hoy_usd)}</b><span>${d.hoy_pct>0?"+":""}${d.hoy_pct.toFixed(2)}%</span></div>
    <div class="t"><small>Toward goal</small><b class="${cl(d.total_pct)}">${d.total_pct>0?"+":""}${d.total_pct.toFixed(2)}%</b><span>goal ${d.meta_pct}%</span></div>
    <div class="t"><small>Daily loss room</small><b class="${pd>d.lim_diario*.6?"amb":"verde"}">${(d.lim_diario-pd).toFixed(1)}%</b><span>limit ${d.lim_diario}%</span></div>`;
  $("bots").innerHTML=d.bots.map(b=>{const [c,t]=estadoBot(d,b),tot=(b.cerrado||0)+(b.flotante||0);
    return `<div class="t bot e-${c}"><i></i><div><b>${nom(b.nombre)}</b><span>${t} · ${b.ops} trades</span></div><b class="${cl(tot)}">${usd(tot)}</b></div>`}).join("");
  const nuevo=JSON.stringify(d.avisos_enviados||[])!==$("log").dataset.v;
  if(nuevo){$("log").dataset.v=JSON.stringify(d.avisos_enviados||[]);
    $("log").innerHTML=(d.avisos_enviados||[]).slice(0,8).map((a,i)=>`<p style="animation-delay:${i*.08}s"><em>${a.hora}</em>${a.texto}</p>`).join("")||`<p><em>–</em>No alerts yet.</p>`}
  const ok=d.conectado&&d.algo_terminal&&!d.demo;
  $("pt").className="pt "+(d.demo?"":ok?"v":"m");$("est").textContent=d.demo?"Example data":ok?"Live":"MT5 offline";
  $("aviso").textContent=d.demo?"EXAMPLE DATA — not your account":"";
  poner(d.bots);
  d.bots.forEach((b,i)=>{const u=ROB[i].userData,[c,t]=estadoBot(d,b);u.col=c;u.mats.forEach(m=>m.color.setHex(COL[c]));
    const x=u.lab.getContext("2d");x.clearRect(0,0,256,64);x.fillStyle="#000a";x.fillRect(0,0,256,64);x.fillStyle="#d7e3f4";x.font="600 24px system-ui";x.textAlign="center";x.fillText(nom(b.nombre),128,28);
    x.fillStyle="#"+COL[c].toString(16).padStart(6,"0");x.font="20px system-ui";x.fillText(t,128,54);u.tx.needsUpdate=true});
  if(!D||JSON.stringify(D.curva)!==JSON.stringify(d.curva))tD=performance.now()/1000;   // la curva se vuelve a dibujar solo si cambió
  D=d;laterales(d);
}

// ---------- animación
let on=true,prev=0,ultC=0;
$("btn3d").onclick=()=>{on=!on;$("btn3d").textContent="3D: "+(on?"on":"off");esc.classList.toggle("off",!on);if(on){ajustar();requestAnimationFrame(bucle)}};
const V=new THREE.Vector3(),SPH=new THREE.Spherical();
function bucle(ms){
  if(!on)return;requestAnimationFrame(bucle);
  const s=ms/1000,dt=Math.min(.05,s-prev||.016);prev=s;
  // calidad automática: si va lento, se apaga el brillo
  if(conBrillo&&s>3){acum+=dt;frames++;if(frames===120){if(acum/frames>.029)conBrillo=false;frames=0;acum=0}}
  for(let i=0;i<NP;i++){pp[i*3+1]+=dt*(.12+(i%5)*.04);if(pp[i*3+1]>6)pp[i*3+1]=0}pg.attributes.position.needsUpdate=true;
  radar.rotation.y-=dt*.7;
  PANT.forEach((p,i)=>{p.scan.position.y=p.hh/2-((s*.35+i*.3)%1)*p.hh;p.halo.material.opacity=.28+.1*Math.sin(s*1.5+i)});
  L2.intensity=18+6*Math.sin(s*.9);
  ROB.forEach(r=>{const u=r.userData,c=u.col,f=u.f,[b1,b2]=u.brazos;
    const op=c==="verde",mira=c==="amb",quieto=c==="rojo"||c==="gris";
    u.cu.position.y=Math.sin(s*(op?2.6:1.5)+f)*(quieto?.012:.07);
    u.cab.rotation.y=mira?Math.sin(s*.7+f)*.7:op?Math.sin(s*1.7+f)*.15:0;
    u.cab.rotation.x=quieto?.35:op?Math.sin(s*5+f)*.06:Math.sin(s*.5+f)*.05;
    if(op){b1.rotation.x=-1.1+Math.sin(s*15+f)*.22;b2.rotation.x=-1.1+Math.sin(s*15+f+2)*.22;b1.rotation.z=b2.rotation.z=0}
    else if(mira){const w=Math.sin(s*.5+f)>.92;b1.rotation.x=Math.sin(s*1.3+f)*.15;b2.rotation.x=w?-2.6+Math.sin(s*9)*.3:-Math.sin(s*1.3+f)*.15;b1.rotation.z=-.1;b2.rotation.z=w?.4:.1}   // de vez en cuando saluda
    else{b1.rotation.x=b2.rotation.x=0;b1.rotation.z=-.05;b2.rotation.z=.05}
    u.ojos.scale.y=((s+f)%4.2)<.13?.1:1;   // parpadeo
    u.mats[1].opacity=.5+.5*Math.abs(Math.sin(s*(op?6:2)+f));
    u.mats[0].opacity=quieto?.45:1;
    u.aro.scale.setScalar(1+.05*Math.sin(s*3+f));
    const ph=((s*(op?.9:.5)+f)%1);u.onda.scale.setScalar(1+ph*1.8);u.mats[3].opacity=quieto?0:(1-ph)*.7;
    u.holo.visible=op;if(op){u.holo.rotation.y+=dt*1.6;u.barras.forEach((b,i)=>b.scale.y=.4+1.4*Math.abs(Math.sin(s*2.2+i*1.3+f)))}
    if(!quieto&&Math.random()<dt*(op?3:.7))lanzar(r)});
  PAQ.forEach(p=>{if(!p.r)return;p.t+=dt*.55;if(p.t>=1){p.r=null;p.m.visible=false;return}
    p.r.userData.curva.getPoint(p.t,p.m.position);p.m.scale.setScalar(1+Math.sin(p.t*Math.PI)*.6)});
  if(s-ultC>.08){ultC=s;centro(s)}
  // cámara: si no la tocás por 3 s, se mece sola
  if(s-tocado>3){V.copy(cam.position).sub(ctl.target);SPH.setFromVector3(V);
    SPH.theta+=(Math.sin(s*.13)*.4-SPH.theta)*.01;SPH.phi+=(1.2+Math.sin(s*.09)*.08-SPH.phi)*.01;
    cam.position.copy(ctl.target).add(V.setFromSpherical(SPH))}
  ctl.update();
  conBrillo?C.render():R.render(S,cam);
}
requestAnimationFrame(bucle);
async function ciclo(){pintar(await leer())}
ciclo();setInterval(()=>{if(!document.hidden)ciclo()},5000);
</script>
