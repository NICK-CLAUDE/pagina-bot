<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060b14">
<title>Bot Room</title>
<style>
:root{--bg:#060b14;--card:#0c1522;--line:#1a2a40;--tx:#d7e3f4;--mut:#7d8fa8;--ok:#2dd4a0;--mal:#ff5d6c;--amb:#f5b942;--azul:#5ab0ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
header b{letter-spacing:.14em;font-size:13px}header b i{color:var(--azul);font-style:normal}
header span{margin-left:auto;font-size:12px;color:var(--mut)}
.pt{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block;margin-right:5px}.pt.v{background:var(--ok)}.pt.m{background:var(--mal)}
#esc{position:relative;max-width:900px;margin:auto;height:min(55vh,96vw);min-height:300px;max-height:680px;overflow:hidden;background:radial-gradient(120% 90% at 50% 30%,#fff3e0,#f6d9bb 60%,#e9c39f)}
#esc canvas{display:block;width:100%;height:100%}
#aviso{position:absolute;left:12px;top:10px;z-index:5;font-size:11px;color:var(--amb);background:#000a;padding:3px 8px;border-radius:6px}
#aviso:empty{display:none}
#capa{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.burb{position:absolute;left:0;top:0;--c:#f0a830;background:#fffdf8;color:#3b3347;font:700 13px/1.25 system-ui,-apple-system,sans-serif;padding:6px 11px;border-radius:14px;border:2.5px solid var(--c);box-shadow:0 3px 10px #5a3a2033;white-space:nowrap;will-change:transform;display:none}
.burb::after{content:"";position:absolute;left:var(--cola,50%);bottom:-9px;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--c);border-bottom:0}
.burb::before{content:"";position:absolute;left:var(--cola,50%);top:100%;width:2px;margin-left:-1px;height:var(--hilo,0);background:var(--c);opacity:.7}
.tag{position:absolute;left:0;top:0;font:700 10.5px/1 system-ui,-apple-system,sans-serif;color:#fff;background:#4a3b52c4;padding:3px 7px;border-radius:9px;white-space:nowrap;will-change:transform;display:none}
.falla{position:absolute;inset:auto 16px 16px;margin:0;color:#6b4a3a;font-size:13px}
main{padding:12px 16px;display:grid;gap:12px;max-width:900px;margin:auto}
.fila{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.t{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.t small{display:block;color:var(--mut);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.t b{font-size:22px}.t span{display:block;color:var(--mut);font-size:11.5px}
.verde{color:var(--ok)}.rojo{color:var(--mal)}.amb{color:var(--amb)}
.bot{display:flex;align-items:center;gap:10px}
.bot i{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 10px var(--c);animation:late 1.6s infinite}
.bot.e-verde{--c:var(--ok)}.bot.e-amb{--c:var(--amb)}.bot.e-rojo{--c:var(--mal)}.bot.e-gris{--c:var(--mut)}.bot.e-verde{border-color:#2dd4a055}
.bot.e-verde i{animation-duration:.7s}.bot.e-rojo i,.bot.e-gris i{animation:none}
@keyframes late{50%{opacity:.35;transform:scale(.7)}}
.pt.v{box-shadow:0 0 8px var(--ok);animation:late 1.6s infinite}
.log p{animation:entra .5s both}@keyframes entra{from{opacity:0;transform:translateX(-12px)}}
.t{transition:border-color .3s}.t:hover{border-color:#2a6fd6}
.bot div{flex:1}.bot b{font-size:15px}
h3{margin:4px 0 0;font-size:11px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.log{background:var(--card);border:1px solid var(--line);border-radius:10px}
.log p{margin:0;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px}.log p:last-child{border:0}
.log em{font-style:normal;color:var(--mut);margin-right:8px}
@media(min-width:700px){.fila{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><b>BOT <i>ROOM</i></b><span><i class="pt" id="pt"></i><em id="est" style="font-style:normal">Connecting…</em></span></header>
<div id="esc"><div id="capa"></div><span id="aviso"></span></div>
<main>
  <div class="fila" id="tiles"></div>
  <h3>Bots</h3><div id="bots" style="display:grid;gap:10px"></div>
  <h3>Activity</h3><div class="log" id="log"></div>
</main>

<script>
const $=id=>document.getElementById(id);

// ---------- datos: igual que el panel (túnel de la PC + clave); sin conexión o con ?demo se ve un ejemplo que va cambiando solo
const LS={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}}};
const FIJA=location.hostname.endsWith("github.io"),CLAVE=LS.get("panel_clave"),BASE=FIJA?LS.get("panel_base"):"";
const DEMO_FORZADO=/demo/.test(location.search)||location.protocol==="file:";
const NOM={"Tendencia 4H":"Trend 4H","Williams Ruptura":"Williams Breakout","Rango Asiatico":"Asian Range"};
const nom=n=>NOM[n]||n;
function ejemplo(){   // un guion de 6 pasos de 9 s: abre, gana, pierde, pausa, se cae MT5...
  const t=Date.now()/1000,ciclo=Math.floor(t/54),paso=Math.floor(t/9)%6;
  const curva=[],t0=1770000000;let v=5000;for(let i=0;i<30;i++){v+=(Math.sin(i*1.3)*30+22);curva.push([t0+i*86400,Math.round(v*100)/100])}
  const T="Tendencia 4H",W="Williams Ruptura",A="Rango Asiatico";
  const pos=[],cer=[],ctrl={[T]:"activo",[W]:"activo",[A]:paso>=3&&paso<5?"activo":"pausado"};
  if(paso<3)pos.push({bot:T,sim:"XAUUSD",lado:"compra",neto:12+paso*7+Math.sin(t)*3});
  if(paso===1)pos.push({bot:W,sim:"USTEC",lado:"venta",neto:22+Math.sin(t*1.3)*4});
  if(paso>=2)cer.push({t:ciclo*10+2,sim:"USTEC",bot:W,neto:41.2});
  if(paso>=3)cer.push({t:ciclo*10+3,sim:"XAUUSD",bot:T,neto:-12.4});
  if(paso===4)pos.push({bot:A,sim:"USDJPY",lado:"compra",neto:-3+Math.sin(t)*2});
  const ab=b=>pos.filter(p=>p.bot===b).length;
  const av=[{hora:"09:12",texto:"Trend 4H opened XAUUSD (buy)."},{hora:"07:40",texto:"New day. Daily loss limit reset."}];
  if(paso>=2)av.unshift({hora:"09:30",texto:"Williams Breakout closed USTEC: won $41.20."});
  if(paso>=3)av.unshift({hora:"09:41",texto:"Trend 4H closed XAUUSD: lost $12.40."});
  return {demo:true,conectado:paso!==5,algo_terminal:true,capital:5000,saldo:v,patrimonio:v,hoy_usd:42.1,hoy_pct:.84,total_pct:(v-5000)/50,meta_pct:8,lim_diario:5,lim_total:10,
    bots:[{nombre:T,abiertas:ab(T),cerrado:96,flotante:0,ops:4},{nombre:W,abiertas:ab(W),cerrado:41,flotante:0,ops:3},{nombre:A,abiertas:ab(A),cerrado:-12,flotante:0,ops:2}],
    control:ctrl,curva,posiciones:pos,cerradas_hoy:cer,avisos_enviados:av};
}
async function leer(){
  if(DEMO_FORZADO)return ejemplo();
  try{
    const r=await fetch(BASE+"estado.json",{cache:"no-store",headers:{"X-Clave":CLAVE}});
    if(!r.ok)throw 0;const d=await r.json();if(d.sin_datos)throw 0;return d;
  }catch(e){return ejemplo()}
}
const usd=v=>(v<0?"-":"")+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const cl=v=>v>0?"verde":v<0?"rojo":"";
function estadoBot(d,b){
  if(!d.conectado||!d.algo_terminal)return ["gris","Offline"];
  if((d.control||{})[b.nombre]==="pausado")return ["rojo","Paused"];
  if(b.abiertas>0)return ["verde","In a trade"];
  return ["amb","Watching"];
}

// ---------- personajes (solo datos; la escena 3D de abajo los lee en cada cuadro)
const PJ={};let D=null;
function personaje(nombre,i){return PJ[nombre]||(PJ[nombre]={nombre,i,est:"amb",ev:null,texto:""})}

// ---------- datos -> personajes y eventos (ganó / perdió)
const VISTOS=new Set();let primera=true;
function actualizar(d){
  d.bots.forEach((b,i)=>{const p=personaje(b.nombre,i),[e]=estadoBot(d,b);p.est=e;
    const pos=(d.posiciones||[]).find(o=>o.bot===b.nombre);
    if(pos){p.mercado=pos.sim;p.texto=(pos.lado==="compra"?"BUY ":"SELL ")+pos.sim+" "+(pos.neto>=0?"+":"")+usd(pos.neto??0)}});
  const t=performance.now()/1000;
  (d.cerradas_hoy||[]).forEach(o=>{const k=o.t+"|"+o.sim+"|"+o.bot;if(VISTOS.has(k))return;VISTOS.add(k);
    const p=PJ[o.bot];if(primera||!p)return;
    p.ev={tipo:o.neto>=0?"gana":"pierde",monto:o.neto,hasta:t+4.5}});   // el confeti lo tira la escena
  primera=false;
}

// ---------- HUD (HTML)
function pintar(d){
  const pd=Math.max(0,-d.hoy_pct);
  $("tiles").innerHTML=
   `<div class="t"><small>Balance</small><b>${usd(d.saldo)}</b><span>of $${d.capital.toLocaleString("en-US")}</span></div>
    <div class="t"><small>Today</small><b class="${cl(d.hoy_usd)}">${usd(d.hoy_usd)}</b><span>${d.hoy_pct>0?"+":""}${d.hoy_pct.toFixed(2)}%</span></div>
    <div class="t"><small>Toward goal</small><b class="${cl(d.total_pct)}">${d.total_pct>0?"+":""}${d.total_pct.toFixed(2)}%</b><span>goal ${d.meta_pct}%</span></div>
    <div class="t"><small>Daily loss room</small><b class="${pd>d.lim_diario*.6?"amb":"verde"}">${(d.lim_diario-pd).toFixed(1)}%</b><span>limit ${d.lim_diario}%</span></div>`;
  $("bots").innerHTML=d.bots.map(b=>{const [c,t]=estadoBot(d,b),tot=(b.cerrado||0)+(b.flotante||0);
    return `<div class="t bot e-${c}"><i></i><div><b>${nom(b.nombre)}</b><span>${t} · ${b.ops} trades</span></div><b class="${cl(tot)}">${usd(tot)}</b></div>`}).join("");
  const v=JSON.stringify(d.avisos_enviados||[]);
  if(v!==$("log").dataset.v){$("log").dataset.v=v;
    $("log").innerHTML=(d.avisos_enviados||[]).slice(0,8).map((a,i)=>`<p style="animation-delay:${i*.08}s"><em>${a.hora}</em>${a.texto}</p>`).join("")||`<p><em>–</em>No alerts yet.</p>`}
  const ok=d.conectado&&d.algo_terminal&&!d.demo;
  $("pt").className="pt "+(d.demo?"":ok?"v":"m");$("est").textContent=d.demo?"Example data":ok?"Live":"MT5 offline";
  $("aviso").textContent=d.demo?"EXAMPLE — not your account":"";
  D=d;actualizar(d);
}
async function ciclo(){pintar(await leer())}
ciclo();setInterval(()=>{if(!document.hidden)ciclo()},DEMO_FORZADO?3000:5000);
setTimeout(()=>{if(!window.SALA3D)$("capa").innerHTML='<p class="falla">The 3D room could not load. The numbers below are still up to date.</p>'},12000);
</script>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
// ---------- la sala en 3D (estilo juguete): todo hecho con figuras simples, sin modelos externos
import * as THREE from "three";
import {RoundedBoxGeometry} from "three/addons/geometries/RoundedBoxGeometry.js";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const QS=new URLSearchParams(location.search),FF=+QS.get("ff")||1;   // depuración: ?ff=4 acelera las caminatas
const cuadro=QS.has("sim")?f=>setTimeout(()=>f(performance.now()),40):requestAnimationFrame;   // ?sim: anima con temporizador (Chrome sin pantalla casi no da cuadros)
const box=$("esc"),capa=$("capa");
const ren=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:"low-power"});
ren.setPixelRatio(Math.min(devicePixelRatio,1.5));ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;
box.prepend(ren.domElement);
const esc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(30,1,.5,90);

// luces: cielo cálido + un sol (la única sombra)
esc.add(new THREE.HemisphereLight("#fff6ea","#d9c2a2",2.1));
const sol=new THREE.DirectionalLight("#fff0d8",2.3);sol.position.set(3,10,6);sol.castShadow=true;sol.shadow.mapSize.set(1024,1024);
Object.assign(sol.shadow.camera,{left:-6.5,right:6.5,top:6.5,bottom:-6.5,near:2,far:26});sol.shadow.camera.updateProjectionMatrix();
sol.shadow.bias=-.0005;sol.shadow.normalBias=.03;esc.add(sol);

// ayudantes de figuras
const MATS={};
const mat=(c,o={})=>{const k=c+JSON.stringify(o);return MATS[k]||(MATS[k]=new THREE.MeshStandardMaterial({color:c,roughness:.82,metalness:0,...o}))};
function malla(geo,c,o){const m=new THREE.Mesh(geo,typeof c==="string"?mat(c,o):c);m.castShadow=m.receiveShadow=true;return m}
const caja=(w,h,d,c,r=.05)=>malla(new RoundedBoxGeometry(w,h,d,2,Math.min(r,w/2-.002,h/2-.002,d/2-.002)),c);
const esf=(r,c,s=18)=>malla(new THREE.SphereGeometry(r,s,Math.round(s*.7)),c);
const cil=(a,b,h,c,s=20)=>malla(new THREE.CylinderGeometry(a,b,h,s),c);
const cap=(r,l,c)=>malla(new THREE.CapsuleGeometry(r,l,6,12),c);
const pon=(m,x,y,z,padre=esc)=>{m.position.set(x,y,z);padre.add(m);return m};
function lienzo(w,h){const c=document.createElement("canvas");c.width=w;c.height=h;const tx=new THREE.CanvasTexture(c);tx.colorSpace=THREE.SRGBColorSpace;tx.anisotropy=2;return [c.getContext("2d"),tx]}
const plano=(w,h,tx)=>new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tx,toneMapped:false}));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,k)=>a+(b-a)*k;
const angDif=(a,b)=>{let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d};
function brillo(col){const [x,tx]=lienzo(64,64),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,col);g.addColorStop(1,"#0000");x.fillStyle=g;x.fillRect(0,0,64,64);
  return new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}))}

// ---------- la sala: piso x -4.7..4.7, z -4.15..3.75; paredes al fondo y a la izquierda
{const [x,tx]=lienzo(256,256);for(let i=0;i<8;i++){x.fillStyle=i%2?"#efd1a6":"#e8c798";x.fillRect(0,i*32,256,32);x.fillStyle="#d8b385";x.fillRect(0,i*32+31,256,1);x.fillRect((i*97)%256,i*32,2,32)}
  tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.repeat.set(2.5,2.5);
  const piso=pon(caja(9.4,.3,7.9,new THREE.MeshStandardMaterial({map:tx,roughness:.9}),.12),0,-.15,-.2);piso.castShadow=false}
const PARED="#fcf2e2",ZOC="#b8e0d0";
pon(caja(9.4,3.2,.26,PARED,.1),0,1.6,-4.28);pon(caja(.26,3.2,6.9,PARED,.1),-4.83,1.6,-.7);
pon(caja(9.4,1,.06,ZOC,.03),0,.5,-4.13);pon(caja(.06,1,6.9,ZOC,.03),-4.68,.5,-.7);
pon(caja(9.4,.08,.1,"#ffffff",.03),0,1.02,-4.1);pon(caja(.1,.08,6.9,"#ffffff",.03),-4.65,1.02,-.7);

// cielo de las ventanas (las nubes se corren despacio)
const [cx,cielo]=lienzo(128,128);
{const g=cx.createLinearGradient(0,0,0,128);g.addColorStop(0,"#8fd0f2");g.addColorStop(1,"#e3f5fb");cx.fillStyle=g;cx.fillRect(0,0,128,128);
  cx.fillStyle="#ffffffdd";[[20,40,10],[32,36,13],[46,42,9],[86,78,9],[98,72,12],[110,80,8]].forEach(([a,b,r])=>{cx.beginPath();cx.arc(a,b,r,0,7);cx.fill()});
  cx.fillStyle="#a8d99a";cx.fillRect(0,112,128,16);cielo.wrapS=THREE.RepeatWrapping}
function ventana(x,y,z,ry){const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ry;esc.add(g);
  pon(caja(1.4,1.3,.1,"#ffffff",.04),0,0,0,g);pon(plano(1.2,1.1,cielo),0,0,.056,g);
  pon(caja(.06,1.1,.05,"#ffffff",.02),0,0,.07,g);pon(caja(1.2,.06,.05,"#ffffff",.02),0,0,.07,g);
  pon(caja(1.6,.08,.22,"#ffffff",.03),0,-.68,.09,g);
  for(const s of[-1,1])pon(caja(.26,1.45,.08,"#f7b8c4",.04),s*.8,.02,.12,g)}
ventana(-3.45,2.15,-4.12,0);ventana(3.45,2.15,-4.12,0);ventana(-4.66,2.15,1.3,Math.PI/2);

// pantalla grande de la pared: saldo, avance a la meta y curva
const [pc,ptx]=lienzo(512,224);
pon(caja(3.35,1.55,.12,"#56607a",.07),0,2.3,-4.08);pon(plano(3.15,1.37,ptx),0,2.3,-4.015);
let saldoV=null;
function pintarPantalla(t){const x=pc;x.fillStyle="#26344d";x.fillRect(0,0,512,224);const d=D;if(!d)return;
  saldoV=saldoV==null?d.saldo:saldoV+(d.saldo-saldoV)*.25;
  x.fillStyle="#a9bad4";x.font="700 22px system-ui";x.fillText("BALANCE",26,42);
  if(Math.sin(t*4)>0){x.fillStyle="#ff7d8c";x.beginPath();x.arc(420,35,7,0,7);x.fill()}x.fillStyle="#a9bad4";x.fillText("LIVE",434,42);
  x.fillStyle=d.total_pct>=0?"#86e8bf":"#ff9aa6";x.font="800 62px system-ui";x.fillText(usd(saldoV),24,106);
  const p=clamp(d.total_pct/d.meta_pct,0,1);x.fillStyle="#3b4b68";x.beginPath();x.roundRect(26,124,460,20,10);x.fill();
  x.fillStyle="#86e8bf";x.beginPath();x.roundRect(26,124,Math.max(20,460*p),20,10);x.fill();
  x.fillStyle="#dfe8f5";x.font="700 22px system-ui";x.fillText((d.total_pct>0?"+":"")+d.total_pct.toFixed(2)+"% of "+d.meta_pct+"% goal",26,174);
  const cu=(d.curva||[]).map(v=>v[1]);if(cu.length>1){const mn=Math.min(...cu),mx=Math.max(...cu),X0=300,W=186,Y0=156,H=56;
    x.strokeStyle="#9fd2ff";x.lineWidth=3;x.lineJoin="round";x.beginPath();
    cu.forEach((v,i)=>{const a=X0+W*i/(cu.length-1),b=Y0+H-(v-mn)/((mx-mn)||1)*H;i?x.lineTo(a,b):x.moveTo(a,b)});x.stroke()}
  ptx.needsUpdate=true}

// velitas animadas para los monitores
function velitas(x,w,h,t,seed){x.fillStyle="#22304a";x.fillRect(0,0,w,h);
  for(let i=0;i<Math.floor(w/12);i++){const f=k=>Math.sin(k*.9+seed+t*.8)+Math.sin(k*.3+seed*2+t*.35),v=f(i),hh=6+Math.abs(Math.sin(i*1.7+seed+t*1.2))*h/3;
    x.fillStyle=v>f(i-1)?"#7ee0b5":"#ff8fa0";x.fillRect(4+i*12,h/2-v*h/6-hh/2,8,hh);x.fillRect(7+i*12,h/2-v*h/6-hh/2-5,2,hh+10)}}

// escritorios del fondo (uno por bot) con monitor, teclado, taza y banquito
const DESK_X=[-2.5,0,2.5],MON=[],CC=["#7db3ea","#f4a2b8","#86d3ad"];
function banquito(x,z,c){pon(cil(.27,.27,.09,c),x,.36,z);pon(cil(.05,.05,.32,"#a5adbf"),x,.17,z);pon(cil(.2,.22,.04,"#a5adbf"),x,.02,z)}

  pon(caja(1.5,.08,.85,"#f6ddb8",.03),x,.74,-3.3);
  for(const s of[-1,1])pon(caja(.08,.7,.78,"#e6c597",.03),x+s*.68,.36,-3.3);
  pon(cil(.04,.05,.2,"#8d96aa"),x,.87,-3.62);pon(caja(.92,.6,.07,"#69728a",.04),x,1.22,-3.62);
  const [c,tx]=lienzo(128,80);MON.push([c,tx,i*2.7]);pon(plano(.82,.5,tx),x,1.22,-3.58);
  pon(caja(.5,.03,.18,"#ffffff",.012),x,.795,-3.0);pon(cil(.055,.05,.11,CC[i]),x+.52,.835,-3.1);
  banquito(x,-2.35,"#f6b98f")});

    // prueba lugares cada vez más lejos (arriba primero, después a los costados y abajo); si no entra, no se muestra
    for(const [dx,dy] of HUECOS){b.l=clamp(l0+dx*b.w,4,W-b.w-4);b.t=t0+dy;if(b.t<4||b.t+b.h>H-4)continue;if(!ocup.some(o=>choca(b,o,6))){ok=true;break}}
    if(!ok){b.e.style.display="none";continue}
    ocup.push(b);const hilo=Math.max(0,b.ay-10-(b.t+b.h));
    b.e.style.transform=`translate(${b.l|0}px,${b.t|0}px)`;b.e.style.setProperty("--cola",clamp(b.ax-b.l,14,b.w-14)+"px");b.e.style.setProperty("--hilo",(hilo>3?hilo:0)+"px");
    b.e.style.zIndex=20-B.indexOf(b)}
  // nombres chiquitos a los pies; si chocan con algo se esconden
  for(const c of Object.values(C)){const e=c.tag;if(!e._w){e.style.display="block";e._w=e.offsetWidth;e._h=e.offsetHeight}
    const f=proy(c.x,0,c.z),r={l:clamp(f.x-e._w/2,2,W-e._w-2),t:f.y+6,w:e._w,h:e._h};
    const ok=r.t+r.h<H-2&&!ocup.some(o=>choca(r,o,2));e.style.display=ok?"block":"none";
    if(ok){ocup.push(r);e.style.transform=`translate(${r.l|0}px,${r.t|0}px)`}}}

// ---------- cámara: encuadra toda la sala en el ancho del celular; se puede girar un poco con el dedo
const OBJ=new THREE.Vector3(0,.55,-.3),AZ=.2,POL=.7;
const ESQ=[[-4.1,0,3.75],[4.1,0,3.75],[4.7,0,-4.15],[-4.7,3.2,-4.15],[4.7,3.2,-4.15],[-4.7,3.2,2.75],[-4.7,0,-4.15]].map(v=>new THREE.Vector3(...v));
const ctl=new OrbitControls(cam,ren.domElement);ctl.target.copy(OBJ);ctl.enableZoom=false;ctl.enablePan=false;ctl.enableDamping=true;ctl.rotateSpeed=.5;
ctl.minAzimuthAngle=AZ-.5;ctl.maxAzimuthAngle=AZ+.5;ctl.minPolarAngle=POL-.18;ctl.maxPolarAngle=POL+.08;
ren.domElement.style.touchAction="pan-y";   // deslizar vertical sigue moviendo la página
let tocado=-99;ctl.addEventListener("start",()=>tocado=1e9);ctl.addEventListener("end",()=>tocado=performance.now()/1000);
const _sph=new THREE.Spherical();
function ponerCam(d,th=AZ,ph=POL){cam.position.setFromSpherical(_sph.set(d,ph,th)).add(OBJ);cam.lookAt(OBJ);cam.updateMatrixWorld();cam.updateProjectionMatrix()}
function encuadrar(){const w=box.clientWidth,h=box.clientHeight;ren.setSize(w,h,false);cam.aspect=w/h;
  let lo=5,hi=70;for(let k=0;k<24;k++){const d=(lo+hi)/2;ponerCam(d);if(ESQ.every(p=>{const v=p.clone().project(cam);return Math.abs(v.x)<.97&&v.y<.93&&v.y>-.97}))hi=d;else lo=d}
  ponerCam(hi);ctl.update()}
addEventListener("resize",encuadrar);encuadrar();

// ---------- bucle
let ult=0,tPant=0,tMon=0;
function bucle(ms){cuadro(bucle);if(document.hidden)return;
  const t=ms/1000,dt=Math.min(.05,(t-ult)||.016),ahora=performance.now()/1000;ult=t;
  for(const n in PJ)if(!C[n])C[n]=hacerBot(PJ[n]);
  for(const c of Object.values(C))animar(c,t,dt,ahora);
  // vida del cuarto
  PLANTAS.forEach((h,k)=>{h.rotation.z=Math.sin(t*1.1+k)*.06;h.rotation.x=Math.sin(t*.8+k*2)*.04});
  VAPOR.forEach((v,k)=>{const f=(t*.5+k/3)%1;v.position.set(-4.12+Math.sin(t*2+k)*.03,.98+f*.45,-1.65);v.material.opacity=.55*(1-f);v.scale.setScalar(.6+f*1.2)});
  const h=new Date();AM.rotation.z=-(h.getMinutes()+h.getSeconds()/60)/60*Math.PI*2;AH.rotation.z=-((h.getHours()%12)+h.getMinutes()/60)/12*Math.PI*2;
  const caida=D&&!(D.conectado&&D.algo_terminal),pulso=.5+.5*Math.sin(t*(caida?9:3));
  lampMat.emissiveIntensity=caida?.4+pulso*1.6:.25;halo.visible=!!caida;halo.scale.setScalar(1+pulso*.9);halo.material.opacity=.5+pulso*.5;
  charco.material.opacity=caida?.1+pulso*.2:.05;LEDS.forEach((l,k)=>l.visible=caida?Math.sin(t*7+k*1.7)>0:(k%2===0));
  cielo.offset.x=t*.004;ktx.offset.x=t*.04;
  if(t-tMon>.15){tMon=t;MON.forEach(([x,tx,sd])=>{velitas(x,128,80,t,sd);tx.needsUpdate=true})}
  if(t-tPant>.25){tPant=t;pintarPantalla(t);pintarTicker()}
  for(let k=0;k<NC;k++){const q=CF[k];if(!q){conf.setMatrixAt(k,_0);continue}
    q.vy-=5.5*dt;q.vx*=.985;q.vz*=.985;q.x+=q.vx*dt;q.y=Math.max(.02,q.y+q.vy*dt);q.z+=q.vz*dt;q.r+=q.w*dt;q.v-=dt;
    conf.setMatrixAt(k,_m.compose(_v.set(q.x,q.y,q.z),_q.setFromEuler(_e.set(q.r,q.r*.7,0)),_s))}
  for(let k=CF.length-1;k>=0;k--)if(CF[k].v<=0)CF.splice(k,1);
  conf.instanceMatrix.needsUpdate=true;
  // balanceo lento de la cámara cuando nadie la toca
  if(ahora-tocado>4){_sph.setFromVector3(_v.copy(cam.position).sub(OBJ));_sph.theta+=(AZ+Math.sin(t*.13)*.14-_sph.theta)*.02;_sph.phi+=(POL-_sph.phi)*.02;
    cam.position.setFromSpherical(_sph).add(OBJ);cam.lookAt(OBJ)}
  ctl.update();
  ren.render(esc,cam);etiquetas()}
cuadro(bucle);
window.SALA3D=true;
</script>
