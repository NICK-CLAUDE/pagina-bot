<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FDM</title><link rel="manifest" href="fdm.webmanifest"><meta name="theme-color" content="#1a1a1e">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font:16px system-ui,sans-serif;background:#101013;color:#ececf1;padding-bottom:96px}
header{position:sticky;top:0;background:#17171b;padding:16px 16px 0;z-index:2;box-shadow:0 2px 12px #0008}
h1{margin:0 0 10px;font-size:22px;display:flex;align-items:baseline;justify-content:space-between}
.lg{font-weight:800;letter-spacing:.5px;color:#5bc0f8}#gs{font-size:13px;font-weight:400;color:#8d8d99}
#tabs{display:flex}#tabs button{flex:1;background:none;border:0;color:#8d8d99;padding:12px 0;font-size:15px;border-bottom:3px solid transparent;transition:.2s}
#tabs button.on{color:#5bc0f8;border-color:#5bc0f8;font-weight:600}
#lista{padding:10px 12px}
.it{background:#1a1a1f;border-radius:14px;padding:14px;margin-bottom:10px}.top{display:flex;align-items:center;gap:12px}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.ic{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;background:#5bc0f822;color:#5bc0f8;flex:none;padding:0}
.ok .ic{background:#4cc38a22;color:#4cc38a}.er .ic{background:#ef535022;color:#ef5350}.pa .ic{background:#ffffff14;color:#8d8d99}
.ic svg,.x svg,nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.x{background:none;border:0;color:#6d6d79;padding:8px}
.bar{height:6px;background:#2a2a31;border-radius:3px;margin:12px 0 8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#3aa6e6,#5bc0f8);border-radius:3px;transition:width .6s}
.ok .bar i{background:#4cc38a}.pa .bar i{background:#6d6d79}.er .bar i{background:#ef5350}
.in{color:#8d8d99;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:#17171bf2;backdrop-filter:blur(10px);display:flex;justify-content:space-around;align-items:center;padding:10px 0 14px;border-top:1px solid #26262c}
nav button{background:none;border:0;color:#5bc0f8;padding:10px 18px}
nav .add{background:#5bc0f8;color:#101013;border-radius:50%;width:58px;height:58px;padding:0;margin-top:-26px;box-shadow:0 4px 16px #5bc0f855}nav .add svg{width:28px;height:28px}
#msg{padding:48px 24px;color:#8d8d99;text-align:center}
dialog{background:#1a1a1f;color:#ececf1;border:0;border-radius:18px;width:92%;max-width:440px;padding:20px}dialog::backdrop{background:#000a}
dialog input{width:100%;padding:14px;background:#101013;color:#ececf1;border:1px solid #333;border-radius:10px;font-size:16px;margin-top:12px}
dialog button{margin-top:12px;padding:14px;width:100%;border:0;border-radius:10px;background:#5bc0f8;color:#101013;font-size:16px;font-weight:600}
</style>
<header><h1><span class="lg">FDM</span><small id="gs"></small></h1><div id="tabs"><button data-f="todo" class="on">Todo</button><button data-f="bajando">Bajando</button><button data-f="listas">Completadas</button><button data-f="archivos">Files</button></div></header>
<div id="lista"></div><div id="msg"></div>
<nav><button id="bi" title="Iniciar todo"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></button><button id="bp" title="Pausar todo"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button><button class="add" id="ba"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button id="bl" title="Borrar completadas"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></nav>
<dialog id="d"><b>Agregar descarga</b><br><br><input id="u" placeholder="Pegá el link" autocomplete="off"><button id="go">Bajar en la PC</button></dialog>
<script>
const $=id=>document.getElementById(id),LS={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let BASE=LS.get("panel_base"),CLAVE=LS.get("panel_clave"),F="todo",ITEMS=[];
{const m=location.hash.match(/k=([\w-]+)/);if(m){CLAVE=m[1];LS.set("panel_clave",CLAVE);history.replaceState(null,"",location.pathname+location.search)}}
async function tunel(){try{const u=(await (await fetch("../panel/tunel.txt?x="+Date.now(),{cache:"no-store"})).text()).trim()+"/";
  if(/^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/$/.test(u)&&u!==BASE){BASE=u;LS.set("panel_base",u);return true}}catch(e){}return false}
const ftm=(u,o)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);return fetch(u,{...o,signal:c.signal}).finally(()=>clearTimeout(t))};
async function rpc(method,params=[]){
  const op={method:"POST",headers:{"X-Clave":CLAVE},body:JSON.stringify({jsonrpc:"2.0",id:1,method,params:method=="system.multicall"?params:["token:"+CLAVE,...params]})};
  let r;try{r=await ftm(BASE+"rpc",op)}catch(e){if(await tunel())r=await ftm(BASE+"rpc",op);else throw e}
  if(!r.ok)throw new Error(r.status);const j=await r.json();if(j.error)throw new Error(j.error.message);return j.result}
const K=["gid","status","totalLength","completedLength","downloadSpeed","files","errorMessage"];
const sz=b=>b>=1e9?(b/1e9).toFixed(2)+" GB":b>=1e6?(b/1e6).toFixed(1)+" MB":(b/1e3).toFixed(0)+" KB";
const nom=d=>{const f=d.files&&d.files[0];let p=f&&(f.path||(f.uris&&f.uris[0]&&f.uris[0].uri))||d.gid;return decodeURIComponent(p.split(/[\/]/).pop().split("?")[0])||d.gid};
let FILES=[];
const fecha=t=>new Date(t*1000).toLocaleString("es-AR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
function pintarArchivos(){
  $("lista").innerHTML=FILES.map((f,i)=>`<div class="it"><div class="top"><div class="ic"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></svg></div><div class="nm" style="white-space:normal;word-break:break-all">${f.n.replace(/</g,"&lt;")}</div><button class="x" data-a="dl" data-i="${i}" style="color:#5bc0f8" title="Download to phone"><svg viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg></button><button class="x" data-a="rm" data-i="${i}"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="in" style="margin-top:6px">${sz(f.s)} • ${fecha(f.t)}</div></div>`).join("");
  $("msg").textContent=FILES.length?"PC folder: Downloads":"The folder is empty"}
function pintar(){if(F=="archivos")return pintarArchivos();
  const v=ITEMS.filter(d=>F=="todo"||(F=="listas"?d.status=="complete":d.status!="complete"));
  $("lista").innerHTML=v.map(d=>{const t=+d.totalLength,c=+d.completedLength,s=+d.downloadSpeed,p=t?c/t*100:0,cls=d.status=="complete"?"ok":d.status=="error"?"er":d.status=="paused"?"pa":"";
    const eta=s>0&&t?Math.round((t-c)/s):0,et=eta?(eta>=3600?Math.floor(eta/3600)+"h ":"")+String(Math.floor(eta%3600/60)).padStart(2,"0")+":"+String(eta%60).padStart(2,"0"):"";
    const info=d.status=="complete"?sz(t)+" • Completada":d.status=="error"?"Error: "+(d.errorMessage||""):d.status=="paused"?sz(c)+(t?" / "+sz(t):"")+" • En pausa":d.status=="waiting"?"En cola":sz(c)+(t?" / "+sz(t):"")+" • "+sz(s)+"/s"+(et?" • "+et:"");
    const IC={pause:`<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>`,play:`<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>`,ok:`<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>`,err:`<svg viewBox="0 0 24 24"><path d="M12 6v8M12 18v.01"/></svg>`,x:`<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>`};const ic=cls=="ok"?IC.ok:cls=="er"?IC.err:cls=="pa"?IC.play:IC.pause;
    return `<div class="it ${cls}"><div class="top"><button class="ic" data-a="t" data-g="${d.gid}">${ic}</button><div class="nm">${nom(d).replace(/</g,"&lt;")}</div><button class="x" data-a="x" data-g="${d.gid}">${IC.x}</button></div><div class="bar"><i style="width:${p}%"></i></div><div class="in">${info}</div></div>`}).join("");
  $("msg").textContent=v.length?"":"No hay descargas";
}
async function api2(ruta,cuerpo){const op={method:"POST",headers:{"X-Clave":CLAVE},body:JSON.stringify(cuerpo)};let r;try{r=await ftm(BASE+ruta,op)}catch(e){if(await tunel())r=await ftm(BASE+ruta,op);else throw e}if(!r.ok)throw new Error(r.status);return r.json()}
let OCUP=0;
async function ver(){if(document.hidden||OCUP)return;OCUP=1;try{await ver2()}finally{OCUP=0}}
const caido=on=>{$("gs").textContent=on?"reconectando…":$("gs").textContent};
async function ver2(){
  if(F=="archivos"){try{const r=await ftm(BASE+"files",{headers:{"X-Clave":CLAVE},cache:"no-store"});if(!r.ok)throw 0;FILES=await r.json();pintarArchivos()}catch(e){caido(1)}return}
  if(!CLAVE){$("msg").textContent="Falta la clave: abrí el panel una vez con su link (el que tiene #k=...).";return}
  try{const r=await rpc("system.multicall",[[{methodName:"aria2.tellActive",params:["token:"+CLAVE,K]},{methodName:"aria2.tellWaiting",params:["token:"+CLAVE,0,100,K]},{methodName:"aria2.tellStopped",params:["token:"+CLAVE,0,100,K]},{methodName:"aria2.getGlobalStat",params:["token:"+CLAVE]}]]);const g=r[3][0];$("gs").textContent=+g.numActive?"↓ "+sz(+g.downloadSpeed)+"/s · "+g.numActive+" bajando":"";
    ITEMS=[...r[0][0],...r[1][0],...r[2][0].reverse()];LS.set("fdm_cache",JSON.stringify(ITEMS.slice(0,40)));pintar()}
  catch(e){caido(1);if(!ITEMS.length)$("msg").textContent="No llega a la PC (¿está prendida?). Reintentando…"}}
const bajar=async u=>{try{
  $("msg").textContent="Buscando el archivo...";u=(await api2("resolver",{url:u})).url;
  await rpc("aria2.addUri",[[u]]);ver()}catch(e){alert("No se pudo bajar: "+(String(e.message).startsWith("4")?"no pude sacar el archivo de esa página (puede pedir clave, captcha o publicidad)":e.message));ver()}};
$("lista").onclick=async e=>{const b=e.target.closest("button");if(!b)return;
  if(F=="archivos"){const f=FILES[b.dataset.i];if(!f)return;
    try{if(b.dataset.a=="dl"){const j=await api2("files/link",{n:f.n});location.href=BASE+j.u}
      else if(confirm("¿Borrar "+f.n+" de la PC? No se puede deshacer.")){await api2("files/delete",{n:f.n});ver()}}catch(e){alert("No se pudo: "+e.message)}return}const d=ITEMS.find(x=>x.gid==b.dataset.g);if(!d)return;
  try{if(b.dataset.a=="t"){if(d.status=="paused")await rpc("aria2.unpause",[d.gid]);else if(d.status=="active"||d.status=="waiting")await rpc("aria2.pause",[d.gid]);else if(d.status=="error"){const u=d.files[0].uris[0]&&d.files[0].uris[0].uri;if(u){await rpc("aria2.removeDownloadResult",[d.gid]);await bajar(u)}}}
    else{if(d.status=="active"||d.status=="waiting"||d.status=="paused")await rpc("aria2.forceRemove",[d.gid]);try{await rpc("aria2.removeDownloadResult",[d.gid])}catch(e){}}}catch(e){}ver()};
$("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;F=b.dataset.f;if(F=="archivos"){FILES=[];$("lista").innerHTML=""}document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x==b));F=="archivos"?ver():pintar()};
$("bi").onclick=()=>rpc("aria2.unpauseAll").then(ver);$("bp").onclick=()=>rpc("aria2.pauseAll").then(ver);$("bl").onclick=()=>rpc("aria2.purgeDownloadResult").then(ver);
$("ba").onclick=()=>{$("d").showModal();$("u").focus()};
$("go").onclick=()=>{const m=$("u").value.match(/https?:\/\/\S+/);if(m){bajar(m[0]);$("u").value="";$("d").close()}};
const q=new URLSearchParams(location.search),m=((q.get("url")||"")+" "+(q.get("text")||"")).match(/https?:\/\/\S+/);
if(m){history.replaceState(null,"",location.pathname);bajar(m[0])}
try{ITEMS=JSON.parse(LS.get("fdm_cache")||"[]");pintar()}catch(e){}
ver();setInterval(ver,2000);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script>
