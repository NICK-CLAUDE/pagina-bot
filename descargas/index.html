<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FDM</title>
<link rel="manifest" href="fdm.webmanifest">
<meta name="theme-color" content="#0f1115">
<style>
:root{color-scheme:dark;--bg:#0f1115;--s1:#161a20;--s2:#1e232b;--ln:#252a33;--tx:#e8eaee;--mu:#9aa3b0;--ac:#55bff5;--acd:#17384b;--ok:#52c48f;--am:#f2b35b;--er:#f06a63}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(120px + env(safe-area-inset-bottom));font-variant-numeric:tabular-nums}
::selection{background:var(--acd);color:#fff}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
* {scrollbar-width:thin;scrollbar-color:#2c323c transparent}

/* barra superior */
header{position:relative;z-index:5;background:var(--bg);padding:max(14px,env(safe-area-inset-top)) 16px 0;border-bottom:1px solid var(--ln)}
.top{display:flex;align-items:center;gap:10px;min-height:48px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:99px;font-size:13px;font-weight:600;background:var(--s2);color:var(--mu)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.old{opacity:.55}.chip.g5{color:var(--ok);background:#52c48f1f}.chip.g2{color:var(--am);background:#f2b35b1f}
.ib{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--ac)}
.ib:active{background:var(--s2)}
#tabs{position:sticky;top:0;display:flex;background:var(--bg);border-bottom:1px solid var(--ln);z-index:4}
#tabs button{flex:1;height:48px;font-size:15px;font-weight:600;color:var(--mu);border-bottom:3px solid transparent;display:flex;align-items:center;justify-content:center;gap:8px}
#tabs button.on{color:var(--ac);border-color:var(--ac)}
#tabs b{min-width:22px;padding:1px 7px;border-radius:99px;background:var(--s2);color:var(--tx);font-size:12px;font-weight:600}
#tabs b:empty{display:none}#tabs button.on b{background:var(--acd);color:var(--ac)}
.sum{display:flex;align-items:center;gap:12px;min-height:52px}
.sum p{margin:0;flex:1;font-size:14px;color:var(--mu)}
.sum b{display:block;color:var(--tx);font-weight:700;font-size:26px;line-height:1.15;margin:0 0 2px}
#a24{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;margin:0 0 8px;padding:0 14px;border-radius:14px;background:var(--s1);border:1px solid var(--ln);font-size:14px;font-weight:600;text-align:left}
#a24 span{flex:1}#a24 small{display:block;font-weight:400;font-size:12.5px;color:var(--mu)}
.sw{width:46px;height:28px;border-radius:99px;background:#39404b;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
#a24[aria-checked=true] .sw{background:var(--ac)}#a24[aria-checked=true] .sw::after{transform:translateX(18px)}
#disco{display:grid;gap:8px;margin:12px 16px 0}
.dk{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:10px 12px}
.dk .dt{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mu)}
.dk .dt b{color:var(--tx);font-size:20px;line-height:1.3}.dk .dt em{font-style:normal;text-align:right}
.dk .bar{height:6px;margin-top:8px;background:var(--s2)}.dk .bar i{background:var(--ok)}
.dk.am .bar i{background:var(--am)}.dk.er .bar i{background:var(--er)}
.dk .dw{margin-top:8px;font-size:13px;line-height:1.35}.dk.am .dw{color:var(--am)}.dk.er .dw{color:var(--er)}
.dk.er{border-color:#f06a6355}.dk.am{border-color:#f2b35b44}
.gh{list-style:none;position:sticky;top:48px;z-index:3;display:flex;justify-content:space-between;padding:9px 16px;background:var(--bg);border-bottom:1px solid var(--ln);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.mt3{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mt3 span{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:8px;background:var(--s2);color:#c4c9d2;font-size:12.5px;font-weight:600}
.mt3 span.k{background:#52c48f1c;color:var(--ok)}
#esp{margin:6px 2px 0}#esp.low{color:var(--am)}
.sum button{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--s2);font-size:14px;font-weight:600;color:var(--ac)}
.sum button svg{width:18px;height:18px}
#off{display:none;padding:10px 16px;background:#f2b35b1a;color:var(--am);font-size:14px}
#off.on{display:block}

/* lista única */
#lista{list-style:none;margin:0;padding:0}
.row{position:relative;display:grid;grid-template-columns:44px 1fr 24px;column-gap:14px;align-items:start;padding:14px 16px 16px;border-bottom:1px solid var(--ln);cursor:pointer}
.row:active{background:var(--s1)}
.ft{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--s2);color:var(--mu);font-size:11px;font-weight:700;letter-spacing:.04em}
.st-active .ft{background:var(--acd);color:var(--ac)}.ft svg{width:24px;height:24px}
.st-error .ft{background:#f06a6322;color:var(--er)}
.bd{min-width:0}
.pl{display:inline-flex;align-items:center;height:22px;padding:0 9px;margin-right:8px;border-radius:99px;font-size:12px;font-weight:600;vertical-align:1px;background:var(--s2);color:var(--mu)}
.pl.a{background:var(--acd);color:var(--ac)}.pl.ok{background:#52c48f22;color:var(--ok)}.pl.q{background:#f2b35b1f;color:var(--am)}.pl.e{background:#f06a6322;color:var(--er)}
.st-complete .ft{background:#52c48f22;color:var(--ok)}
.st-waiting .ft{background:#f2b35b1f;color:var(--am)}
.st-paused .ft{background:var(--s2);color:var(--mu)}
.st-complete .nm{color:#b9c0cb;font-weight:500}
.mt2{margin-top:6px;font-size:13px;color:var(--ac);font-weight:600}
.nm{font-size:15.5px;font-weight:500;line-height:1.35;word-break:break-word}
.mt{margin-top:3px;font-size:13px;color:var(--mu)}
.st-error .mt{color:var(--er)}
.st-waiting .nm,.st-paused .nm{color:#c4c9d2}
.chev{margin-top:10px;color:#5b6370;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.row.open .chev{transform:rotate(90deg)}
.bar{height:4px;border-radius:2px;background:var(--s2);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:var(--p,0%);background:var(--ac);border-radius:2px;transition:width .6s linear}
.st-paused .bar i{background:#6c7482}
.ac{grid-column:1/-1;display:none;gap:8px;margin-top:14px}
.row.open .ac{display:flex}
.ac button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:12px;background:var(--s2);font-size:14.5px;font-weight:600}
.ac button.p{background:var(--ac);color:#0b1217}
.ac button.d{color:var(--er)}
.ac button.d.sure{background:var(--er);color:#190b0a}
.ac svg{width:19px;height:19px}

#vacio{padding:56px 28px;text-align:center;color:var(--mu);font-size:15px}
#vacio b{display:block;color:var(--tx);font-size:17px;margin-bottom:8px}

/* botón agregar + aviso */
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;background:var(--ac);color:#0b1217;display:grid;place-items:center;box-shadow:0 6px 18px #0009,0 1px 3px #0006}
.fab svg{width:28px;height:28px;stroke-width:2.4}
.fab:active{transform:scale(.96)}
#toast{position:fixed;left:16px;right:92px;bottom:calc(24px + env(safe-area-inset-bottom));background:#262c36;border-radius:12px;padding:13px 14px;font-size:14px;line-height:1.35;display:none;box-shadow:0 6px 18px #0009}
#toast.on{display:block}

/* diálogos */
dialog{background:var(--s1);color:var(--tx);border:1px solid var(--ln);border-radius:18px;width:calc(100% - 32px);max-width:460px;padding:20px}
dialog::backdrop{background:#000b}
dialog h2{margin:0 0 12px;font-size:18px}
dialog textarea{width:100%;min-height:150px;padding:14px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;resize:vertical}
dialog textarea::placeholder{color:#7d8592}
.bt{width:100%;height:50px;margin-top:12px;border-radius:12px;background:var(--ac);color:#0b1217;font-weight:700;font-size:16px}
.bt.s{background:var(--s2);color:var(--tx);font-weight:600}
.rd{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--bg);margin-top:8px}
.rd div{flex:1;min-width:0}.rd b{font-weight:600}.rd small{display:block;color:var(--mu);font-size:13px}
.rd button{height:40px;padding:0 16px;border-radius:99px;background:var(--s2);font-weight:600;color:var(--ac)}
.rd.on{outline:1px solid var(--ac)}
.nota{color:var(--mu);font-size:13px;margin-top:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <div class="top">
    <h1>FDM</h1>
    <span id="wb" class="chip" hidden><i></i><span></span></span>
    <button class="ib" id="wf" aria-label="WiFi de la PC"><svg viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0M5 13a10 10 0 0 1 14 0M8.5 16.5a5 5 0 0 1 7 0M12 20v.01"/></svg></button>
  </div>
  <div class="sum"><p id="sum">Conectando…</p><button id="todo" hidden></button></div>
  
</header>
<nav id="tabs"><button data-t="d" class="on">Bajando<b id="nd"></b></button><button data-t="f">Archivos<b id="nf"></b></button></nav>
<div id="disco" hidden></div>
<div id="off">Sin conexión. Reintentando…</div>
<ul id="lista"></ul>
<div id="vacio" hidden><b>Sin descargas</b>Tocá + y pegá los links.</div>
<button class="fab" id="ba" aria-label="Agregar descarga"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="toast" role="status"></div>

<dialog id="d">
  <h2>Agregar</h2>
  <textarea id="u" placeholder="Pegá los links" autocomplete="off"></textarea>
  <select id="ds" style="width:100%;margin:8px 0;padding:12px;border-radius:12px;background:#1a2330;color:inherit;border:1px solid #2a3646;font:inherit">
    <option value="">Descargas (Downloads)</option>
    <option value="C:\Users\NICO\Desktop">Escritorio</option>
    <option value="C:\Users\NICO\Desktop\DESCARGAS">Escritorio\DESCARGAS</option>
    <option value="C:\Users\NICO\Desktop\JUEGOS">Escritorio\JUEGOS</option>
    <option value="C:\Users\NICO\Desktop\JUEGOS\Roms y Updates">JUEGOS\Roms y Updates</option>
    <option value="C:\Users\NICO\Documents">Documentos</option>
    <option value="C:\Users\NICO\Videos">Videos</option>
  </select>
  <p class="nota" id="esp"></p>
  <button class="bt" id="go">Bajar</button>
  <button class="bt s" id="gc">Cancelar</button>
</dialog>
<dialog id="w">
  <h2>WiFi de la PC</h2>
  <div id="wi" class="nota" style="margin:0 0 10px">Cargando…</div>
  <button id="a24" role="switch" aria-checked="false"><span>Al terminar, pasar a 2,4 GHz<small id="a24t">Apagado: sigue en 5 GHz</small></span><i class="sw"></i></button>
  <div id="wl"></div>
  <p class="nota">Al cambiar se corta unos segundos.</p>
  <button class="bt s" id="wc">Cerrar</button>
</dialog>

<script>
const $=id=>document.getElementById(id);
const LS={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let BASE=location.hostname.endsWith("github.io")?LS.get("panel_base"):location.origin+"/",CLAVE=LS.get("panel_clave");
{const m=location.hash.match(/k=([\w-]+)/);if(m){CLAVE=m[1];LS.set("panel_clave",CLAVE);history.replaceState(null,"",location.pathname+location.search)}}

/* ---------- conexión con la PC ---------- */
let ULTT=0;
async function tunel(){if(Date.now()-ULTT<20000)return false;ULTT=Date.now();
  const f=[async()=>atob((await (await fetch("https://api.github.com/repos/NICK-CLAUDE/pagina-bot/contents/panel/tunel.txt",{cache:"no-store"})).json()).content),
    async()=>(await fetch("../panel/tunel.txt?x="+Date.now(),{cache:"no-store"})).text()];
  for(const g of f){try{const u=(await g()).trim()+"/";if(/^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/$/.test(u)&&u!==BASE){BASE=u;LS.set("panel_base",u);return true}}catch(e){}}return false}
let LARGO=0;
const ftm=(u,o,ms)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||(LARGO?90000:12000));return fetch(u,{...o,signal:c.signal}).finally(()=>clearTimeout(t))};
const FIJA=location.hostname.endsWith("github.io"),TS="https://pc-trading.tail44059b.ts.net/";let TSMAL=0,CF=BASE;   // dirección fija por Tailscale primero; si no responde, el túnel de Cloudflare
async function pedir(ruta,op){let r=null;
  if(FIJA&&Date.now()>TSMAL){try{r=await ftm(TS+ruta,op,BASE===TS?8000:3500);if(r.status>=500||r.status===404)throw 0;BASE=TS}catch(e){r=null;TSMAL=Date.now()+20000;if(BASE===TS)BASE=CF}}
  if(!r){try{r=await ftm(BASE+ruta,op)}catch(e){if(await tunel()){CF=BASE;r=await ftm(BASE+ruta,op)}else throw e}}
  if(!r.ok)throw new Error(r.status);return r}
const H=()=>({"X-Clave":CLAVE});
const api2=async(ruta,cuerpo)=>(await pedir(ruta,{method:"POST",headers:H(),body:JSON.stringify(cuerpo)})).json();
async function rpc(method,params=[]){const j=await (await pedir("rpc",{method:"POST",headers:H(),body:JSON.stringify({jsonrpc:"2.0",id:1,method,params:["token:"+CLAVE,...params]})})).json();if(j.error)throw new Error(j.error.message);return j.result}

/* ---------- formato ---------- */
const num=(n,d)=>n.toFixed(d).replace(".",",");
const sz=b=>b>=1e9?num(b/1e9,2)+" GB":b>=1e6?num(b/1e6,1)+" MB":Math.max(1,Math.round(b/1e3))+" KB";
const dur2=s=>s>=3600?Math.floor(s/3600)+" h "+Math.floor(s%3600/60)+" min":s>=60?Math.floor(s/60)+" min "+Math.round(s%60)+" s":Math.round(s)+" s";
const dur=s=>s>=3600?Math.floor(s/3600)+" h "+Math.floor(s%3600/60)+" min":Math.max(1,Math.round(s/60))+" min";
const hhmm=d=>String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
function fecha(t){const d=new Date(t*1000),h=new Date(),a=new Date(h.getFullYear(),h.getMonth(),h.getDate());
  if(d>=a)return "hoy "+hhmm(d);if(d>=new Date(a-864e5))return "ayer "+hhmm(d);return d.getDate()+" "+["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][d.getMonth()]}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const nom=d=>{const f=d.files&&d.files[0],ruta=f&&f.path,u=f&&f.uris&&f.uris[0]&&f.uris[0].uri;let p=(ruta||u||d.gid).split(/[\/]/).pop().split("?")[0];if(!ruta)p=p.replace(/\+/g," ");try{p=decodeURIComponent(p)}catch(e){}return p||d.gid};
const ext=n=>{const m=n.match(/\.([A-Za-z0-9]{1,4})$/);return m?m[1].toUpperCase():"ARCH"};

/* ---------- íconos ---------- */
const I={pause:'<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>',play:'<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>',
x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',dl:'<svg viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>',
trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
retry:'<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 1 3 6.2M4 19v-5h5"/></svg>',chev:'<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>'};
const B=(a,k,ic,txt,cls="")=>`<button class="${cls}" data-a="${a}" data-k="${esc(k)}">${I[ic]}${txt}</button>`;

/* ---------- estado ---------- */
let ITEMS=[],FILES=[],GS={},SEL="",SURE="",CICLO=0,CONECTADO=false;
try{ITEMS=JSON.parse(LS.get("fdm_items")||"[]");FILES=JSON.parse(LS.get("fdm_files")||"[]")}catch(e){}

const IS={dl:'<svg viewBox="0 0 24 24"><path d="M12 5v12M7 12l5 5 5-5"/></svg>',ok:'<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>',
clk:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',pau:'<svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg>',err:'<svg viewBox="0 0 24 24"><path d="M12 6v8M12 18v.01"/></svg>'};
const pill=(c,t)=>`<span class="pl ${c}">${t}</span>`;
let STAMP=Date.now();   // hora en que llegó la última foto de la PC: entre fotos, el avance se estima con la velocidad (el contador no se frena)
function vivoC(d){const c=+d.completedLength,t=+d.totalLength;if(d.status!="active")return c;const dt=Math.min(60,(Date.now()-STAMP)/1000);return Math.min(t?t*.999:c+1e12,c+(+(d.vel||d.downloadSpeed||0))*dt)}
function tick(){if(TAB!="d")return;let v=0;for(const d of ITEMS){if(d.status!="active")continue;const el=document.querySelector('.row[data-k="g:'+d.gid+'"]');if(!el)continue;const c=vivoC(d),t=+d.totalLength,p=t?c/t*100:0;
  const mt=el.querySelector(".mt"),br=el.querySelector(".bar i");if(mt&&c)mt.textContent=sz(c)+" de "+sz(t)+" · "+num(p,0)+" %";if(br)br.style.setProperty("--p",p+"%");v+=+(d.vel||d.downloadSpeed||0)}
  const b=document.querySelector("#sum b");if(b&&v)b.textContent=sz(v)+"/s"}
setInterval(tick,500);
function filaDescarga(d,pos,n){
  const t=+d.totalLength,c=vivoC(d),s=+(d.vel||d.downloadSpeed||0),p=t?c/t*100:0,k="g:"+d.gid,nm=nom(d);
  let box,meta,acc,extra="",bar=p,chips=null;
  if(d.status=="active"){const eta=s>0&&t&&s>2e5?Math.round((t-c)/s):0;
    box=IS.dl;meta=c?sz(c)+" de "+sz(t)+" · "+num(p,0)+" %":"Iniciando…";
    extra=sz(s)+"/s"+(eta?" · "+dur(eta):"");
    acc=B("pausa",k,"pause","Pausar")+B("quitar",k,"x","Cancelar","d")}
  else if(d.status=="waiting"){box=IS.clk;meta=t?sz(t):"";bar=0;acc=B("quitar",k,"x","Quitar","d")}
  else if(d.status=="paused"){box=IS.pau;meta=num(p,0)+" % de "+sz(t);acc=B("seguir",k,"play","Reanudar","p")+B("quitar",k,"x","Cancelar","d")}
  else if(d.status=="complete"){box=IS.ok;meta=sz(t);if(d.trk&&+d.actS>=3)chips=[["k",dur2(d.actS)],["",sz(t/d.actS)+"/s"]].concat(d.fin?[["",fecha(d.fin)]]:[]);else if(d.fin)chips=[["",fecha(d.fin)]];bar=0;acc=B("descartar",k,"x","Quitar")}
  else{box=IS.err;meta=/space|alloc|disk|write/i.test(d.errorMessage||"")?"Sin espacio en el disco":esc(d.errorMessage||"Error");bar=0;acc=B("reintentar",k,"retry","Reintentar","p")+B("descartar",k,"x","Descartar","d")}
  return fila(d.status,k,box,nm,meta,acc,bar,extra,chips)}
function filaArchivo(f){const k="f:"+f.n,sure=SURE==k;
  return fila("file",k,esc(ext(f.n)),f.n,esc(sz(f.s)+" · "+fecha(f.t)),
    B("bajar",k,"dl","Bajar al celu","p")+`<button class="d${sure?" sure":""}" data-a="borrar" data-k="${esc(k)}">${I.trash}${sure?"¿Seguro? Tocá otra vez":"Borrar"}</button>`,0,"")}
function fila(st,k,box,nm,meta,acc,p,extra,chips){return `<li class="row st-${st}${SEL==k?" open":""}" data-k="${esc(k)}"><div class="ft">${box}</div><div class="bd"><div class="nm">${esc(nm)}</div><div class="mt">${meta}</div>${p?`<div class="bar"><i style="--p:${p}%"></i></div>`:""}${extra?`<div class="mt2">${esc(extra)}</div>`:""}${chips?`<div class="mt3">${chips.map(c=>`<span class="${c[0]}">${esc(c[1])}</span>`).join("")}</div>`:""}</div>${I.chev}<div class="ac">${acc}</div></li>`}

let TAB="d";
function pintar(){
  const vivos=ITEMS.filter(d=>["active","waiting","paused","error"].includes(d.status)),ord={active:0,waiting:1,paused:2,error:3};
  vivos.sort((a,b)=>ord[a.status]-ord[b.status]);
  const hechos=ITEMS.filter(d=>d.status=="complete").reverse(),cola=vivos.filter(d=>d.status=="waiting");
  const ocupados=new Set(vivos.map(nom)),arch=FILES.filter(f=>!ocupados.has(f.n));
  const act=vivos.filter(d=>d.status=="active").length,pau=vivos.filter(d=>d.status=="paused").length,v=+GS.downloadSpeed||0;
  $("nd").textContent=act||"";$("nf").textContent=arch.length||"";
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t==TAB));
  const b=$("todo");
  disco();
  if(TAB=="d"){
    const gh=(t,n)=>n?`<li class="gh"><span>${t}</span><span>${n}</span></li>`:"",ST=x=>vivos.filter(d=>d.status==x);
    $("lista").innerHTML=gh("Bajando ahora",ST("active").length)+ST("active").map(d=>filaDescarga(d,0,0)).join("")+gh("En cola",cola.length)+cola.map(d=>filaDescarga(d,cola.indexOf(d),cola.length)).join("")
      +gh("En pausa",ST("paused").length)+ST("paused").map(d=>filaDescarga(d,0,0)).join("")+gh("Con error",ST("error").length)+ST("error").map(d=>filaDescarga(d,0,0)).join("")+gh("Completadas",hechos.length)+hechos.map(d=>filaDescarga(d,0,0)).join("");
    $("vacio").innerHTML="<b>Sin descargas</b>Tocá + y pegá los links.";
    $("vacio").hidden=!!(vivos.length||hechos.length)||!CONECTADO;
    $("sum").innerHTML=!CLAVE?"Falta la clave: abrí el link completo":act||cola.length||pau?`<b>${act?sz(v)+"/s":"Pausado"}</b>${act} bajando${cola.length?" · "+cola.length+" en cola":""}${pau?" · "+pau+" en pausa":""}`:`<b>Sin descargas activas</b>${hechos.length} completada${hechos.length==1?"":"s"}`;
    if(act+cola.length){b.hidden=false;b.dataset.a="pausatodo";b.setAttribute("aria-label","Pausar todo");b.innerHTML=I.pause}else if(pau){b.hidden=false;b.dataset.a="seguirtodo";b.setAttribute("aria-label","Reanudar todo");b.innerHTML=I.play}else if(hechos.length){b.hidden=false;b.dataset.a="limpiar";b.setAttribute("aria-label","Limpiar lista");b.innerHTML=I.x}else b.hidden=true}
  else{
    $("lista").innerHTML=arch.map(filaArchivo).join("");
    $("vacio").innerHTML="<b>Carpeta vacía</b>";
    $("vacio").hidden=!!arch.length||!CONECTADO;
    const tot=arch.reduce((s,f)=>s+f.s,0);
    $("sum").innerHTML=`<b>${arch.length} archivo${arch.length==1?"":"s"}</b>${sz(tot)}`;
    b.hidden=true}
}
$("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;TAB=b.dataset.t;SEL="";SURE="";pintar();window.scrollTo(0,0);if(TAB=="f")ver(1)};

function disco(){const completo=TAB=="f",L=window.LIBRES||{},ks=Object.keys(L);if(!ks.length){$("disco").hidden=true;return}
  const tam=ITEMS.filter(d=>+d.totalLength>0).map(d=>+d.totalLength),avg=tam.length?tam.reduce((a,b)=>a+b,0)/tam.length:0;let h="";
  for(const k of ks){const libre=L[k],esp=ITEMS.filter(d=>d.status=="waiting"&&((d.dir||"").slice(0,2).toUpperCase()||ks[0])==k);
    const conoc=esp.filter(d=>+d.totalLength>0),need=conoc.reduce((a,d)=>a+ +d.totalLength,0)+(esp.length-conoc.length)*avg,quedan=libre-need;
    const cls=!need?(libre<5e9?"er":libre<2e10?"am":""):quedan<0?"er":quedan<5e9?"am":"";
    let msg=!need?(libre<5e9?"Casi sin espacio":""):quedan<0?"No alcanza: entran ~"+Math.max(0,Math.floor(libre/(need/esp.length)))+" de "+esp.length:"Sobran ≈ "+sz(quedan);
    if(!completo&&!cls)continue;h+=`<div class="dk ${cls}"><div class="dt"><span>Libre<br><b>${sz(libre)}</b></span>${need?`<span style="text-align:right">Falta ≈<br><b>${sz(need)}</b></span>`:""}</div>${msg?`<div class="dw">${msg}</div>`:""}</div>`}
  $("disco").hidden=!h;$("disco").innerHTML=h}
let ESPT=0;async function espacio(){if(!CLAVE)return;const t=++ESPT;try{const r=await (await pedir("espacio?dir="+encodeURIComponent($("ds").value),{headers:H(),cache:"no-store"})).json();if(t!=ESPT)return;
  $("esp").textContent="Libre ahí: "+sz(r.libre)+(r.libre<2e10?" · poco":"");$("esp").classList.toggle("low",r.libre<2e10)}catch(e){$("esp").textContent=""}}
/* ---------- carga de datos ---------- */
let VOCUP=0,FALLOS=0;
async function ver(forzar){if(document.hidden||!CLAVE||(VOCUP&&Date.now()-VOCUP<20000))return;VOCUP=Date.now();try{await ver2(forzar)}finally{VOCUP=0}}
async function ver2(forzar){
  try{const r=await pedir("downloads",{headers:H(),cache:"no-store"}),J=await r.json();if(!J.d)throw 0;
    GS=J.d[3][0];STAMP=Date.now()-(J.now-J.t)*1000;window.LIBRES=J.libres||{};ITEMS=[...J.d[0][0],...J.d[1][0],...J.d[2][0]];LS.set("fdm_items",JSON.stringify(ITEMS.slice(0,60)));
    if(forzar||TAB=="f"||CICLO++%3==0){try{FILES=await (await pedir("files",{headers:H(),cache:"no-store"})).json();LS.set("fdm_files",JSON.stringify(FILES.slice(0,80)))}catch(e){}}
    FALLOS=0;CONECTADO=true;$("off").classList.remove("on");pintar()}
  catch(e){if(++FALLOS>=4){$("off").textContent="Sin conexión. Reintentando…";$("off").classList.add("on")}CONECTADO=true;pintar()}}

/* ---------- acciones ---------- */
function aviso(t,ms=5000){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(aviso.t);if(ms)aviso.t=setTimeout(()=>e.classList.remove("on"),ms)}
$("lista").onclick=async e=>{const row=e.target.closest(".row");if(!row)return;const b=e.target.closest("button[data-a]"),k=row.dataset.k;
  if(!b){SEL=SEL==k?"":k;SURE="";pintar();return}
  const a=b.dataset.a,gid=k.startsWith("g:")?k.slice(2):"",nombre=k.startsWith("f:")?k.slice(2):"",d=ITEMS.find(x=>x.gid==gid);
  try{
    if(a=="pausa")await rpc("aria2.pause",[gid]);
    else if(a=="seguir")await rpc("aria2.unpause",[gid]);
    else if(a=="quitar"||a=="descartar"){if(d&&["active","waiting","paused"].includes(d.status))await rpc("aria2.forceRemove",[gid]);try{await rpc("aria2.removeDownloadResult",[gid])}catch(x){}SEL=""}
    else if(a=="reintentar"){const u=d&&d.files[0].uris[0]&&d.files[0].uris[0].uri;if(u){await rpc("aria2.removeDownloadResult",[gid]);await rpc("aria2.addUri",[[u]])}}
    else if(a=="bajar"){const j=await api2("files/link",{n:nombre});location.href=BASE+j.u}
    else if(a=="borrar"){if(SURE!=k){SURE=k;pintar();return}await api2("files/delete",{n:nombre});SURE="";SEL="";FILES=FILES.filter(f=>f.n!=nombre);pintar();aviso("Borrado",3000)}
  }catch(x){aviso("No se pudo: "+x.message)}
  ver()};
$("todo").onclick=async()=>{try{const a=$("todo").dataset.a;await rpc(a=="pausatodo"?"aria2.pauseAll":a=="seguirtodo"?"aria2.unpauseAll":"aria2.purgeDownloadResult");ver()}catch(e){aviso("No se pudo: "+e.message)}};

/* ---------- agregar varios links ---------- */
const links=t=>[...new Set((String(t).match(/https?:\/\/[^\s"'<>]+/g)||[]).map(u=>u.replace(/[.,;:)\]]+$/,"")))];
let OCUPADO=0;
async function bajarVarios(texto){const L=links(texto);if(!L.length){aviso("No hay links");return}
  if(OCUPADO){aviso("Agregando los anteriores…");return}OCUPADO=1;LARGO=1;let ok=0,rep=0;const mal=[];
  for(let i=0;i<L.length;i++){aviso("Agregando "+(i+1)+" de "+L.length+"…",0);
    try{const r=await api2("resolver",{url:L[i]});const nm=decodeURIComponent(r.url.split("?")[0].split("/").pop().replace(/\+/g," "));
      if(ITEMS.some(d=>d.status!="error"&&d.status!="complete"&&nom(d)==nm)||FILES.some(f=>f.n==nm)){rep++;continue}
      await rpc("aria2.addUri",[[r.url],DIR?{dir:DIR}:{}]);ok++}
    catch(e){mal.push((L[i].match(/part\d+/i)||[L[i].slice(0,40)])[0]+" ("+(String(e.message).startsWith("4")?"no pude sacar el archivo":e.message)+")")}
    await new Promise(r=>setTimeout(r,1500))}
  LARGO=0;OCUPADO=0;ver();
  aviso((ok?ok+" agregada"+(ok==1?"":"s"):"No se agregó ninguna")+(rep?" · "+rep+" repetida"+(rep==1?"":"s"):"")+(mal.length?" · fallaron: "+mal.join(", "):""),9000)}
let DIR="";
$("ds").value=LS.get("fdm_dir");if($("ds").selectedIndex<0)$("ds").value="";
$("ba").onclick=()=>{$("d").showModal();$("u").focus();espacio()};$("ds").onchange=espacio;
$("gc").onclick=()=>$("d").close();
$("go").onclick=()=>{DIR=$("ds").value;LS.set("fdm_dir",DIR);const t=$("u").value;$("u").value="";$("d").close();bajarVarios(t)};

/* ---------- WiFi de la PC ---------- */
let SW=0;
function chipBanda(a,viejo){const b=$("wb");if(!a||!a.ssid){b.className="chip"+(viejo?" old":"");b.lastChild.textContent="Sin WiFi";b.hidden=false;return}
  const g5=/^[56]/.test(a.banda||"");b.className="chip "+(g5?"g5":"g2")+(viejo?" old":"");b.lastChild.textContent=(g5?"5 GHz":a.banda||"?")+(LS.get("fdm_a24")=="1"?" → 2,4":"");b.hidden=false}
let A24=LS.get("fdm_a24")=="1";const pa24=()=>{$("a24").setAttribute("aria-checked",A24);$("a24t").textContent=A24?"Prendido: cuando no quede nada por bajar":"Apagado: sigue en 5 GHz"};pa24();
$("a24").onclick=async()=>{A24=!A24;pa24();LS.set("fdm_a24",A24?"1":"0");try{chipBanda(JSON.parse(LS.get("fdm_banda")),false)}catch(e){}try{await api2("wifi/auto",{on:A24})}catch(e){A24=!A24;pa24();aviso("No se pudo cambiar")}};
async function banda(){if(document.hidden||!CLAVE)return;try{const j=await (await pedir("wifi",{headers:H(),cache:"no-store"})).json(),a=j.actual||{};if(typeof j.auto24=="boolean"){A24=j.auto24;LS.set("fdm_a24",A24?"1":"0");pa24()}LS.set("fdm_banda",JSON.stringify(a));chipBanda(a,false)}catch(e){try{const a=JSON.parse(LS.get("fdm_banda"));if(a)chipBanda(a,true)}catch(x){}}}
try{const a=JSON.parse(LS.get("fdm_banda"));if(a)chipBanda(a,true)}catch(e){}
async function wifi(){try{const j=await (await pedir("wifi",{headers:H(),cache:"no-store"})).json(),a=j.actual||{};
  $("wi").textContent=a.ssid?a.ssid+" · "+(a.banda||"?")+" · señal "+(a.senal||"?"):"Sin WiFi";
  $("wl").innerHTML=j.redes.map(n=>`<div class="rd ${n==a.ssid?"on":""}"><div><b>${esc(n)}</b>${/5\s*g/i.test(n)?"<small>5 GHz · más rápida</small>":""}</div>${n==a.ssid?"<small>actual</small>":`<button data-n="${esc(n)}">Conectar</button>`}</div>`).join("")}
  catch(e){$("wi").textContent=SW?"Cambiando… reconectando con la PC":"No llega a la PC"}}
$("wf").onclick=()=>{$("w").showModal();wifi()};$("wc").onclick=()=>$("w").close();
$("wl").onclick=async e=>{const b=e.target.closest("button");if(!b)return;if(!confirm("¿Cambiar la PC a "+b.dataset.n+"? Se corta unos segundos."))return;
  try{await api2("wifi/conectar",{name:b.dataset.n});SW=1;setTimeout(()=>SW=0,70000);$("wi").textContent="Cambiando… la conexión se corta unos segundos";$("wl").innerHTML="";
    let n=0;const iv=setInterval(async()=>{n++;await wifi();banda();if(!/No llega|Cambiando/.test($("wi").textContent)||n>15)clearInterval(iv)},4000)}catch(x){aviso("No se pudo: "+x.message)}};

/* ---------- compartir desde otras apps + arranque ---------- */
const q=new URLSearchParams(location.search),txt=(q.get("url")||"")+" "+(q.get("text")||"");
if(links(txt).length){history.replaceState(null,"",location.pathname);bajarVarios(txt)}
pintar();ver();setInterval(ver,2000);banda();setInterval(banda,12000);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script>
